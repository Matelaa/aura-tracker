name: Announce plugin updates

on:
  push:
    branches: [main]
    # Only a real version bump counts as a release worth announcing — every other
    # commit (README tweaks, screenshots, backend-only work) touches this file too
    # rarely to matter, so gating on it keeps this from firing on every push to main.
    paths: [runelite-plugin.properties]

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish release announcement to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_ANNOUNCEMENTS_WEBHOOK }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          webhook = os.environ.get("DISCORD_WEBHOOK_URL")
          if not webhook:
              raise SystemExit("DISCORD_ANNOUNCEMENTS_WEBHOOK secret is not configured")
          with open("runelite-plugin.properties") as f:
              props = dict(line.strip().split("=", 1) for line in f if "=" in line)
          version = props.get("version", "unknown")
          description = props.get("description", "")
          payload = {
              "username": "Aura Tracker Updates",
              "embeds": [{
                  "title": f"Aura Tracker v{version} is out!",
                  "description": description,
                  "url": os.environ["COMMIT_URL"],
                  "color": 16750592,
                  "fields": [{"name": "Repository", "value": os.environ["REPOSITORY"], "inline": True}],
              }]
          }
          request = urllib.request.Request(
              webhook,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json", "User-Agent": "Aura-Tracker-GitHub-Action"},
              method="POST",
          )
          with urllib.request.urlopen(request) as response:
              if response.status >= 300:
                  raise SystemExit(f"Discord webhook returned HTTP {response.status}")
          PY
